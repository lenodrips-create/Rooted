<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible App - Saved</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #c5c9c6;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
    }

    .menu-bar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #ffffff;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }

    .menu-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .menu-links a {
      text-decoration: none;
      color: #444;
      font-size: 16px;
    }

    .menu-links a:hover,
    .menu-links a.active {
      color: #000;
      border-bottom: 2px solid #000;
    }

    /* Daily verse card */
    .daily-verse {
      max-width: 600px;
      margin: 40px auto;
      margin-left: 16px;
      margin-right: 16px;
      background: #ffffff;
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    @media (min-width: 640px) {
      .daily-verse {
        margin-left: auto;
        margin-right: auto;
      }
    }

    .daily-verse h2 {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 6px;
    }

    .verse-date {
      font-size: 13px;
      color: #999;
      margin-bottom: 18px;
    }

    .verse-text {
      font-size: 20px;
      line-height: 1.6;
      color: #222;
      font-style: italic;
      margin-bottom: 14px;
    }

    .verse-ref {
      font-size: 16px;
      font-weight: bold;
      color: #444;
    }
  
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      height: 44px;
      width: auto;
      border-radius: 6px;
      display: block;
    }

    .news { text-align: left; }
    .news h2, .news .verse-date { text-align: center; }

    .news-list {
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    .news-list li {
      padding: 12px 0;
      border-bottom: 1px solid #e6e8e6;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .news-list li:last-child { border-bottom: none; }

    .news-list a {
      color: #222;
      text-decoration: none;
      font-size: 17px;
      line-height: 1.45;
      min-width: 0;
    }

    .news-list a:hover,
    .news-list a:focus-visible { text-decoration: underline; }

    .news-when {
      flex-shrink: 0;
      font-size: 13px;
      color: #888;
      font-family: Arial, Helvetica, sans-serif;
    }

    .news-status {
      color: #777;
      font-size: 15px;
      justify-content: center !important;
      text-align: center;
    }

    .news-source {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>

  <nav class="menu-bar">
    <div class="logo"><img src="images/rooted-logo-white.jpg" alt="Rooted logo">Rooted</div>
    <ul class="menu-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="read.html">Read</a></li>
      <li><a href="search.html">Search</a></li>
      <li><a href="news.html" class="active">News</a></li>
    </ul>
  </nav>

  <section class="daily-verse news">
    <h2>Daily Faith News</h2>
    <p class="verse-date" id="news-date"></p>
    <ul class="news-list" id="news-list">
      <li class="news-status">Loading today's stories…</li>
    </ul>
    <p class="news-source">Stories from The Epoch Times</p>
  </section>

  <script>
    // Paste your Cloudflare Worker address here (see news-worker.js)
    const NEWS_URL = "https://rootednews.lenodrips.workers.dev/";

    const list = document.getElementById("news-list");

    document.getElementById("news-date").textContent = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/New_York",
      weekday: "long", month: "long", day: "numeric", year: "numeric"
    }).format(new Date());

    function showStatus(message) {
      list.innerHTML = "";
      const li = document.createElement("li");
      li.className = "news-status";
      li.textContent = message;
      list.appendChild(li);
    }

    async function loadNews() {
      if (!NEWS_URL) {
        showStatus("The news feed isn't connected yet. Add your worker address to NEWS_URL in saved.html.");
        return;
      }
      try {
        const res = await fetch(NEWS_URL);
        const data = await res.json();
        if (!data.stories || data.stories.length === 0) {
          showStatus("No stories right now. Check back later today.");
          return;
        }
        list.innerHTML = "";
        for (const story of data.stories) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = story.link;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = story.title;
          li.appendChild(a);
          if (story.date) {
            const when = document.createElement("span");
            when.className = "news-when";
            when.textContent = new Date(story.date).toLocaleDateString("en-US", { month: "short", day: "numeric" });
            li.appendChild(when);
          }
          list.appendChild(li);
        }
      } catch (err) {
        showStatus("Couldn't load the news right now. Try again in a minute.");
      }
    }

    loadNews();
  </script>

</body>
</html>
