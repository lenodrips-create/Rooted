<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bible App - Read</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <style>
    /* Layout: white menu bar on a grey page, one white reading card in the middle */
    :root {
      --page: #c5c9c6;
      --card: #ffffff;
      --ink: #222222;
      --muted: #6b716d;
      --tile: #f2f3f2;
      --tile-hover: #e2e5e3;
      --line: #e6e8e6;
      --mark: #8a6d3b;
      --serif: Georgia, "Times New Roman", serif;
      color-scheme: light;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--page);
      color: var(--ink);
      min-height: 100vh;
      font-family: var(--serif);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      z-index: 10;
      background: var(--card);
    }

    .menu-bar {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      background: var(--card);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-block: 14px;
      padding-left: max(20px, env(safe-area-inset-left, 0px));
      padding-right: max(20px, env(safe-area-inset-right, 0px));
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .logo { font-size: 22px; font-weight: bold; color: #333; }

    .menu-links { display: flex; gap: 20px; list-style: none; }

    .menu-links a { text-decoration: none; color: #444; font-size: 16px; }

    .menu-links a:hover,
    .menu-links a.active { color: #000; border-bottom: 2px solid #000; }

    main {
      padding-block: 32px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .card {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 12px;
      padding: 24px clamp(18px, 4vw, 36px) 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .top-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .crumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      color: var(--muted);
      min-width: 0;
    }

    .crumbs a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
    .crumbs a:hover { border-bottom-color: var(--ink); }

    select {
      padding: 9px 12px;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      border: 1px solid #ccc;
      border-radius: 8px;
      background: var(--card);
    }

    h1 {
      font-size: clamp(26px, 5vw, 34px);
      font-weight: normal;
      text-wrap: balance;
      margin-bottom: 4px;
    }

    .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }

    .section-title {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 26px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
    }

    .grid.numbers { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); }

    .tile {
      display: block;
      background: var(--tile);
      border-radius: 6px;
      padding: 9px 11px;
      font-size: 15px;
      color: var(--ink);
      text-decoration: none;
      font-variant-numeric: tabular-nums;
    }

    .grid.numbers .tile { text-align: center; padding: 10px 0; }

    .tile:hover, .tile:focus-visible { background: var(--tile-hover); outline: none; }
    .tile:focus-visible { box-shadow: 0 0 0 2px var(--ink); }

    .tile.extra::after {
      content: "\2022";
      color: var(--mark);
      margin-left: 6px;
    }

    .legend { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .legend span { color: var(--mark); }

    .note {
      background: var(--tile);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .chapter-text {
      font-size: 19px;
      line-height: 1.75;
      max-width: 65ch;
    }

    .chapter-text p { margin-bottom: 6px; }

    .chapter-text sup {
      font-size: 11px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      margin-right: 3px;
      vertical-align: 0.6em;
      line-height: 0;
    }

    .pager {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 30px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .pager a {
      color: var(--ink);
      text-decoration: none;
      background: var(--tile);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 15px;
    }

    .pager a:hover { background: var(--tile-hover); }
    .pager .spacer { flex: 1; }

    .version { margin-top: 26px; font-size: 13px; color: var(--muted); text-align: center; }

    .status { color: var(--muted); padding: 30px 0; text-align: center; }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      height: 44px;
      width: auto;
      border-radius: 6px;
      display: block;
    }
  </style>
</head>
<body>

  <nav class="menu-bar">
    <div class="logo"><img src="images/rooted-logo-white.jpg" alt="Rooted logo">Rooted</div>
    <ul class="menu-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="read.html" class="active">Read</a></li>
      <li><a href="search.html">Search</a></li>
      <li><a href="news.html">News</a></li>
    </ul>
  </nav>

  <main>
    <section class="card">
      <div class="top-row">
        <div class="crumbs" id="crumbs"></div>
        <select id="bible-choice" aria-label="Choose a Bible">
          <option value="protestant">Protestant</option>
          <option value="catholic">Catholic</option>
          <option value="orthodox">Orthodox</option>
        </select>
      </div>
      <div id="view"><p class="status">Loading…</p></div>
    </section>
  </main>

  <script>
    // ---------- Loads the Bible files in the data folder ----------
    // Each file calls BibleData.setBooks(...) or BibleData.add(...) when it loads.
    window.BibleData = {
      books: {},     // book list for each Bible
      titles: {},    // translation name for each Bible
      text: {},      // chapters for each book, once loaded
      waiting: {},
      setBooks(bible, title, list) {
        this.books[bible] = list;
        this.titles[bible] = title;
      },
      add(bible, bookId, chapters) {
        this.text[bible + "/" + bookId] = chapters;
      },
      load(path) {
        if (this.waiting[path]) return this.waiting[path];
        this.waiting[path] = new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "data/" + path + ".js";
          s.onload = resolve;
          s.onerror = () => {
            delete this.waiting[path];
            reject(new Error("Could not load data/" + path + ".js"));
          };
          document.head.appendChild(s);
        });
        return this.waiting[path];
      }
    };

    const NAMES = { protestant: "Protestant", catholic: "Catholic", orthodox: "Orthodox" };
    const view = document.getElementById("view");
    const crumbs = document.getElementById("crumbs");
    const choice = document.getElementById("bible-choice");

    function esc(t) {
      return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // The address looks like #protestant, #protestant-John, or #protestant-John-3
    function readHash() {
      const parts = location.hash.slice(1).split("-");
      let bible = parts[0];
      if (!NAMES[bible]) {
        bible = "protestant";
        try { const saved = localStorage.getItem("bibleChoice"); if (NAMES[saved]) bible = saved; } catch (e) {}
      }
      return { bible, book: parts[1] || null, chapter: parts[2] ? parseInt(parts[2], 10) : null };
    }

    function link(bible, book, chapter) {
      let h = "#" + bible;
      if (book) h += "-" + book;
      if (chapter) h += "-" + chapter;
      return h;
    }

    async function show() {
      const { bible, book, chapter } = readHash();
      choice.value = bible;
      try { localStorage.setItem("bibleChoice", bible); } catch (e) {}

      try {
        await BibleData.load(bible + "/books");
      } catch (err) {
        view.innerHTML = '<p class="status">' + esc(err.message) + '. Make sure the data folder is next to read.html.</p>';
        return;
      }

      const list = BibleData.books[bible];
      const info = book ? list.find(b => b.id === book) : null;

      if (!info) return showBooks(bible, list);
      if (!chapter || chapter < 1 || chapter > info.chapters) return showChapters(bible, info);
      return showChapter(bible, list, info, chapter);
    }

    // ---------- Screen 1: all the books ----------
    function showBooks(bible, list) {
      crumbs.innerHTML = "<span>" + NAMES[bible] + " Bible</span>";
      const hasExtras = list.some(b => b.extra);
      let html = "<h1>Books of the Bible</h1>";
      html += '<p class="sub">' + list.length + " books · " + esc(BibleData.titles[bible]) + "</p>";

      for (const [key, label] of [["OT", "Old Testament"], ["NT", "New Testament"]]) {
        html += '<p class="section-title">' + label + '</p><div class="grid">';
        for (const b of list.filter(x => x.testament === key)) {
          html += '<a class="tile' + (b.extra ? " extra" : "") + '" href="' + link(bible, b.id) + '">' + esc(b.name) + "</a>";
        }
        html += "</div>";
        if (key === "OT" && hasExtras) {
          html += '<p class="legend"><span>&#8226;</span> Book not found in Protestant Bibles</p>';
        }
      }
      view.innerHTML = html;
      window.scrollTo(0, 0);
    }

    // ---------- Screen 2: chapters of one book ----------
    function showChapters(bible, info) {
      crumbs.innerHTML = '<a href="' + link(bible) + '">' + NAMES[bible] + " Bible</a><span>/</span><span>" + esc(info.name) + "</span>";
      let html = "<h1>" + esc(info.name) + "</h1>";
      html += '<p class="sub">' + info.chapters + (info.chapters === 1 ? " chapter" : " chapters") + "</p>";
      if (bible === "catholic" && info.id === "Psalms") {
        html += '<p class="note">The Douay-Rheims numbers most Psalms one lower than Protestant Bibles. For example, "The Lord is my shepherd" is Psalm 22 here and Psalm 23 in the KJV.</p>';
      }
      html += '<div class="grid numbers">';
      for (let c = 1; c <= info.chapters; c++) {
        html += '<a class="tile" href="' + link(bible, info.id, c) + '">' + c + "</a>";
      }
      view.innerHTML = html + "</div>";
      window.scrollTo(0, 0);
    }

    // ---------- Screen 3: reading one chapter ----------
    async function showChapter(bible, list, info, chapter) {
      crumbs.innerHTML = '<a href="' + link(bible) + '">' + NAMES[bible] + ' Bible</a><span>/</span><a href="' + link(bible, info.id) + '">' + esc(info.name) + "</a>";
      view.innerHTML = '<p class="status">Loading ' + esc(info.name) + "…</p>";

      try {
        await BibleData.load(bible + "/" + info.id);
      } catch (err) {
        view.innerHTML = '<p class="status">' + esc(err.message) + "</p>";
        return;
      }

      const verses = BibleData.text[bible + "/" + info.id][chapter - 1];
      let html = "<h1>" + esc(info.name) + " " + chapter + "</h1>";
      html += '<p class="sub">' + esc(BibleData.titles[bible]) + "</p>";
      html += '<div class="chapter-text">';
      for (const [num, text] of verses) {
        html += "<p><sup>" + num + "</sup>" + esc(text) + "</p>";
      }
      html += "</div>";

      // Previous / next chapter, moving into the next book when needed
      const i = list.findIndex(b => b.id === info.id);
      let prev = null, next = null;
      if (chapter > 1) prev = { book: info, ch: chapter - 1 };
      else if (i > 0) prev = { book: list[i - 1], ch: list[i - 1].chapters };
      if (chapter < info.chapters) next = { book: info, ch: chapter + 1 };
      else if (i < list.length - 1) next = { book: list[i + 1], ch: 1 };

      html += '<div class="pager">';
      html += prev ? '<a href="' + link(bible, prev.book.id, prev.ch) + '">&larr; ' + esc(prev.book.name) + " " + prev.ch + "</a>" : "";
      html += '<span class="spacer"></span>';
      html += next ? '<a href="' + link(bible, next.book.id, next.ch) + '">' + esc(next.book.name) + " " + next.ch + " &rarr;</a>" : "";
      html += "</div>";

      view.innerHTML = html;
      window.scrollTo(0, 0);
    }

    // Switching Bibles keeps you in the same book and chapter when that Bible has it
    choice.addEventListener("change", async function () {
      const { book, chapter } = readHash();
      const bible = choice.value;
      await BibleData.load(bible + "/books").catch(() => {});
      const list = BibleData.books[bible] || [];
      const info = book ? list.find(b => b.id === book) : null;
      location.hash = info ? link(bible, info.id, chapter && chapter <= info.chapters ? chapter : null) : link(bible);
    });

    window.addEventListener("hashchange", show);
    show();
  </script>

</body>
</html>
