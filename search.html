<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooted Bible AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
 
    body {
      background: #c5c9c6;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #222;
    }
 
    .menu-bar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #ffffff;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }
 
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }
 
    .logo img { height: 44px; width: auto; border-radius: 6px; display: block; }
 
    .menu-links { display: flex; gap: 20px; list-style: none; }
    .menu-links a { text-decoration: none; color: #444; font-size: 16px; }
    .menu-links a:hover,
    .menu-links a.active { color: #000; border-bottom: 2px solid #000; }
 
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }
 
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
 
    .label {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 6px;
    }
 
    h1 { font-size: 28px; font-weight: normal; margin-bottom: 6px; }
 
    .intro { color: #6b716d; font-size: 15px; margin-bottom: 18px; }
 
    .chat {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 220px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 4px 2px 12px;
    }
 
    .msg {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
 
    .msg.user { align-self: flex-end; background: #222; color: #fff; border-bottom-right-radius: 4px; }
    .msg.ai { align-self: flex-start; background: #f2f3f2; border-bottom-left-radius: 4px; }
    .msg.error { align-self: center; background: #f6e7e4; color: #8a3324; font-size: 14px; }
 
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 16px; }
 
    .suggestions button {
      font-family: inherit;
      font-size: 14px;
      background: #f2f3f2;
      border: 1px solid #e2e5e3;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      color: #333;
    }
 
    .suggestions button:hover { background: #e2e5e3; }
 
    form { display: flex; gap: 10px; align-items: flex-end; border-top: 1px solid #e6e8e6; padding-top: 14px; }
 
    textarea {
      flex: 1;
      min-width: 0;
      font-family: inherit;
      font-size: 16px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: none;
      height: 52px;
    }
 
    .send {
      font-family: inherit;
      font-size: 15px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      height: 52px;
      cursor: pointer;
    }
 
    .send:hover { background: #000; }
    .send:disabled { background: #888; cursor: default; }
 
    textarea:focus-visible, .send:focus-visible, .suggestions button:focus-visible {
      outline: 2px solid #222;
      outline-offset: 2px;
    }
 
    .chat-head {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
    }

    .chat-tools { display: flex; gap: 8px; }

    .tool-btn {
      font-family: inherit;
      font-size: 14px;
      background: #f2f3f2;
      color: #333;
      border: 1px solid #e2e5e3;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .tool-btn:hover { background: #e2e5e3; }
    .tool-btn[aria-expanded="true"] { background: #222; color: #fff; border-color: #222; }

    .history {
      border: 1px solid #e6e8e6;
      border-radius: 10px;
      margin-bottom: 16px;
      max-height: 320px;
      overflow-y: auto;
    }

    .history-empty { color: #6b716d; font-size: 14px; padding: 14px; text-align: center; }

    .history-item { display: flex; align-items: center; border-bottom: 1px solid #eef0ee; }
    .history-item:last-child { border-bottom: none; }
    .history-item.current { background: #f6f7f6; }

    .history-open {
      flex: 1;
      min-width: 0;
      text-align: left;
      font-family: inherit;
      background: none;
      border: none;
      padding: 11px 14px;
      cursor: pointer;
      color: #222;
    }

    .history-open:hover { background: #f2f3f2; }
    .history-title { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-date { display: block; font-size: 12px; color: #6b716d; margin-top: 2px; }

    .history-delete {
      font-family: inherit;
      font-size: 13px;
      background: none;
      border: none;
      color: #8a3324;
      padding: 11px 14px;
      cursor: pointer;
    }

    .history-delete:hover { text-decoration: underline; }

    .tool-btn:focus-visible, .history-open:focus-visible, .history-delete:focus-visible {
      outline: 2px solid #222;
      outline-offset: -2px;
    }

    [hidden] { display: none !important; }

    /* Sign-in screen */
    .login { max-width: 380px; margin: 8px auto 4px; }
    .login h2 { font-size: 22px; font-weight: normal; margin-bottom: 4px; }
    .login .login-sub { color: #6b716d; font-size: 15px; margin-bottom: 18px; }
    .login label { display: block; font-size: 14px; color: #444; margin: 12px 0 5px; }
    .login input {
      width: 100%;
      font-family: inherit;
      font-size: 16px;
      padding: 11px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    .login input:focus-visible { outline: 2px solid #222; outline-offset: 1px; }
    .login .send { width: 100%; margin-top: 18px; }
    .login-switch { margin-top: 14px; font-size: 14px; color: #6b716d; text-align: center; }
    .link-btn {
      font-family: inherit;
      font-size: inherit;
      background: none;
      border: none;
      color: #222;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }
    .login-msg { margin-top: 14px; font-size: 14px; padding: 10px 12px; border-radius: 8px; }
    .login-msg.error { background: #f6e7e4; color: #8a3324; }
    .login-msg.ok { background: #e8f0ea; color: #2d5a3a; }
    .signed-in { font-size: 13px; color: #6b716d; margin-bottom: 10px; overflow-wrap: anywhere; }

    .fine-print { margin-top: 14px; font-size: 13px; color: #4d534f; text-align: center; }
 
    /* Phone menu */
    .menu-bar { flex-wrap: wrap; gap: 10px; }
    @media (max-width: 480px) {
      .menu-links { gap: 14px; }
      .menu-links a { font-size: 15px; }
    }
  </style>
</head>
<body>
 
  <nav class="menu-bar">
    <div class="logo"><img src="images/rooted-logo-white.jpg" alt="Rooted logo">Rooted</div>
    <ul class="menu-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="read.html">Read</a></li>
    
      <li><a href="search.html">Search</a></li>
      <li><a href="news.html">News</a></li>
    </ul>
  </nav>
 
  <main>
    <section class="card">
      <div class="chat-head">
        <div>
          <p class="label">Bible AI</p>
          <h1>Ask Rooted AI...</h1>
        </div>
        <div class="chat-tools" id="chat-tools" hidden>
          <button type="button" class="tool-btn" id="new-chat">New chat</button>
          <button type="button" class="tool-btn" id="history-toggle" aria-expanded="false" aria-controls="history">Past chats</button>
        </div>
      </div>

      <!-- Sign-in screen: shown until the visitor signs in -->
      <form class="login" id="login" novalidate>
        <h2 id="login-title">Sign in to chat</h2>
        <p class="login-sub" id="login-sub">Enter your email and password to use the Bible AI.</p>
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="email" required>
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" minlength="6" required>
        <button class="send" id="login-submit" type="submit">Sign in</button>
        <p class="login-switch">
          <span id="login-switch-text">New to Rooted?</span>
          <button type="button" class="link-btn" id="login-switch">Create an account</button>
        </p>
        <p class="login-msg" id="login-msg" role="status" hidden></p>
      </form>

      <div id="chat-area" hidden>
      <p class="signed-in"><span id="signed-in-as"></span> · <button type="button" class="link-btn" id="sign-out">Sign out</button></p>

      <div class="history" id="history" hidden></div>

      <div class="suggestions" id="suggestions">
        <button type="button">What does John 3:16 mean?</button>
        <button type="button">Verses about anxiety</button>
        <button type="button">Who was King David?</button>
        <button type="button">What should I read first?</button>
      </div>
 
      <div class="chat" id="chat" aria-live="polite"></div>
 
      <form id="ask-form">
        <textarea id="question" placeholder="Type your question…" aria-label="Your question"></textarea>
        <button class="send" id="send" type="submit">Ask</button>
      </form>
      </div>
    </section>
 
    <p class="fine-print">AI answers can make mistakes. Check them against the Bible itself.</p>
  </main>
 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // Sign-in uses Supabase Auth. This key is the project's public (publishable) key,
    // which is safe to have in the page.
    const SUPABASE_URL = "https://wvghcoovpibfghwphgik.supabase.co";
    const SUPABASE_KEY = "sb_publishable_25KehH6q4w5RMTVM3TADAA_hXcTSYVd";
    const auth = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY).auth;
    let session = null;

    // Bible AI: Supabase Edge Function (supabase/functions/rooted-ai). The API key is stored in Supabase secrets.
    const AI_URL = "https://wvghcoovpibfghwphgik.supabase.co/functions/v1/rooted-ai";
 
    const chat = document.getElementById("chat");
    const form = document.getElementById("ask-form");
    const input = document.getElementById("question");
    const sendBtn = document.getElementById("send");
    const suggestions = document.getElementById("suggestions");
    const historyBox = document.getElementById("history");
    const historyToggle = document.getElementById("history-toggle");
    let messages = [];      // the chat on screen
    let currentId = null;   // its id in the saved list (null until the first answer)
    let busy = false;

    // ---------- Past chats, saved in this browser only ----------
    // Each signed-in person gets their own list on this device
    let STORE_KEY = "rootedChats";
    const MAX_CHATS = 50;

    function loadChats() {
      try {
        const list = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
        return Array.isArray(list) ? list.filter(c => c && c.id && Array.isArray(c.messages)) : [];
      } catch (e) { return []; }
    }

    function saveChats(list) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(list.slice(0, MAX_CHATS))); } catch (e) {}
    }

    function saveCurrent() {
      if (!messages.length) return;
      if (!currentId) currentId = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const first = messages.find(m => m.role === "user");
      const entry = {
        id: currentId,
        title: (first ? first.content : "Chat").replace(/\s+/g, " ").slice(0, 80),
        updated: Date.now(),
        messages: messages.slice()
      };
      saveChats([entry].concat(loadChats().filter(c => c.id !== currentId)));
      if (!historyBox.hidden) renderHistory();
    }

    function formatDate(ms) {
      const d = new Date(ms);
      const today = new Date();
      if (d.toDateString() === today.toDateString()) {
        return "Today, " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }
      return d.toLocaleDateString([], { month: "short", day: "numeric", year: d.getFullYear() === today.getFullYear() ? undefined : "numeric" });
    }

    function renderHistory() {
      const list = loadChats();
      historyBox.innerHTML = "";
      if (!list.length) {
        const p = document.createElement("p");
        p.className = "history-empty";
        p.textContent = "No past chats yet. Your chats are saved on this device after you ask a question.";
        historyBox.appendChild(p);
        return;
      }
      for (const c of list) {
        const row = document.createElement("div");
        row.className = "history-item" + (c.id === currentId ? " current" : "");

        const open = document.createElement("button");
        open.type = "button";
        open.className = "history-open";
        const title = document.createElement("span");
        title.className = "history-title";
        title.textContent = c.title;
        const date = document.createElement("span");
        date.className = "history-date";
        const asked = c.messages.filter(m => m.role === "user").length;
        date.textContent = formatDate(c.updated) + " · " + asked + (asked === 1 ? " question" : " questions");
        open.append(title, date);
        open.addEventListener("click", function () { openChat(c.id); });

        const del = document.createElement("button");
        del.type = "button";
        del.className = "history-delete";
        del.textContent = "Delete";
        del.setAttribute("aria-label", "Delete chat: " + c.title);
        del.addEventListener("click", function () { deleteChat(c.id); });

        row.append(open, del);
        historyBox.appendChild(row);
      }
    }

    function setHistoryOpen(open) {
      historyBox.hidden = !open;
      historyToggle.setAttribute("aria-expanded", String(open));
      if (open) renderHistory();
    }

    function showMessages() {
      chat.innerHTML = "";
      for (const m of messages) addMessage(m.role === "user" ? "user" : "ai", m.content);
      suggestions.hidden = messages.length > 0;
    }

    function openChat(id) {
      if (busy) return;
      const c = loadChats().find(x => x.id === id);
      if (!c) return renderHistory();
      currentId = c.id;
      messages = c.messages.slice();
      showMessages();
      setHistoryOpen(false);
      input.focus();
    }

    function newChat() {
      if (busy) return;
      currentId = null;
      messages = [];
      showMessages();
      setHistoryOpen(false);
      input.focus();
    }

    function deleteChat(id) {
      if (!confirm("Delete this chat? This can't be undone.")) return;
      saveChats(loadChats().filter(c => c.id !== id));
      if (id === currentId && !busy) {
        currentId = null;
        messages = [];
        showMessages();
      } else if (id === currentId) {
        currentId = null; // it will be saved again as a new chat if the answer arrives
      }
      renderHistory();
    }

    document.getElementById("new-chat").addEventListener("click", newChat);
    historyToggle.addEventListener("click", function () { setHistoryOpen(historyBox.hidden); });
 
    function addMessage(kind, text) {
      const div = document.createElement("div");
      div.className = "msg " + kind;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }
 
    async function ask(question) {
      question = question.trim();
      if (!question) return;
 
      if (!AI_URL) {
        addMessage("error", "The Bible AI isn't connected yet. Add your worker address to AI_URL in ask.html.");
        return;
      }
 
      if (busy) return;
      suggestions.hidden = true;
      addMessage("user", question);
      messages.push({ role: "user", content: question });
      input.value = "";
      busy = true;
      sendBtn.disabled = true;
      const thinking = addMessage("ai", "Thinking…");
 
      try {
        let res;
        try {
          // Sent as plain text so the browser doesn't need an extra permission check first
          res = await fetch(AI_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=UTF-8",
              "Authorization": "Bearer " + (session ? session.access_token : "")
            },
            body: JSON.stringify({ messages: messages })
          });
        } catch (e) {
          throw new Error("couldn't reach the AI worker. Open " + AI_URL + " in your browser to check that it's running.");
        }
        let data;
        try {
          data = await res.json();
        } catch (e) {
          throw new Error("the AI worker sent back something unexpected (status " + res.status + "). Make sure the new worker code is deployed.");
        }
        if (res.status === 401) {
          await auth.signOut();
          throw new Error("please sign in again.");
        }
        if (!res.ok || !data.answer) throw new Error(data.error || "No answer came back.");
        thinking.textContent = data.answer;
        messages.push({ role: "assistant", content: data.answer });
        saveCurrent();
      } catch (err) {
        thinking.remove();
        messages.pop();
        addMessage("error", "Couldn't get an answer: " + err.message);
      } finally {
        busy = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }
 
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      ask(input.value);
    });
 
    // Enter sends, Shift+Enter makes a new line
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        ask(input.value);
      }
    });
 
    document.querySelectorAll("#suggestions button").forEach(function (b) {
      b.addEventListener("click", function () { ask(b.textContent); });
    });

    // ---------- Sign in ----------
    const loginForm = document.getElementById("login");
    const loginEmail = document.getElementById("login-email");
    const loginPassword = document.getElementById("login-password");
    const loginSubmit = document.getElementById("login-submit");
    const loginMsg = document.getElementById("login-msg");
    let creating = false; // false = sign in, true = create account

    function loginMessage(text, kind) {
      loginMsg.textContent = text || "";
      loginMsg.className = "login-msg " + (kind || "error");
      loginMsg.hidden = !text;
    }

    function setMode(create) {
      creating = create;
      document.getElementById("login-title").textContent = create ? "Create an account" : "Sign in to chat";
      document.getElementById("login-sub").textContent = create
        ? "Choose an email and a password (at least 6 characters)."
        : "Enter your email and password to use the Bible AI.";
      loginSubmit.textContent = create ? "Create account" : "Sign in";
      loginPassword.autocomplete = create ? "new-password" : "current-password";
      document.getElementById("login-switch-text").textContent = create ? "Already have an account?" : "New to Rooted?";
      document.getElementById("login-switch").textContent = create ? "Sign in" : "Create an account";
      loginMessage("");
    }

    document.getElementById("login-switch").addEventListener("click", function () { setMode(!creating); });

    loginForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = loginEmail.value.trim();
      const password = loginPassword.value;
      if (!email || !password) return loginMessage("Enter your email and password.");
      if (password.length < 6) return loginMessage("Your password needs at least 6 characters.");

      loginSubmit.disabled = true;
      loginMessage("");
      try {
        if (creating) {
          const { data, error } = await auth.signUp({ email, password });
          if (error) throw error;
          if (!data.session) {
            setMode(false);
            loginMessage("Account created. Check your email for a link to confirm it, then sign in here.", "ok");
          }
        } else {
          const { error } = await auth.signInWithPassword({ email, password });
          if (error) throw error;
        }
      } catch (err) {
        const m = String(err && err.message || "");
        if (/invalid login credentials/i.test(m)) loginMessage("That email or password isn't right.");
        else if (/not confirmed/i.test(m)) loginMessage("Please confirm your email first. Check your inbox for the link.");
        else if (/already registered/i.test(m)) loginMessage("There's already an account with that email. Sign in instead.");
        else loginMessage(m || "Something went wrong. Please try again.");
      } finally {
        loginSubmit.disabled = false;
      }
    });

    document.getElementById("sign-out").addEventListener("click", function () { auth.signOut(); });

    // Show the sign-in screen or the chat, depending on whether someone is signed in
    function showFor(newSession) {
      const before = session && session.user.id;
      session = newSession;
      const signedIn = !!session;
      loginForm.hidden = signedIn;
      document.getElementById("chat-area").hidden = !signedIn;
      document.getElementById("chat-tools").hidden = !signedIn;
      if (!signedIn) {
        loginPassword.value = "";
        setHistoryOpen(false);
        return;
      }
      document.getElementById("signed-in-as").textContent = "Signed in as " + (session.user.email || "you");
      if (before !== session.user.id) {
        STORE_KEY = "rootedChats:" + session.user.id;
        currentId = null;
        messages = [];
        showMessages();
      }
    }

    auth.getSession().then(({ data }) => showFor(data.session));
    auth.onAuthStateChange((_event, newSession) => showFor(newSession));
  </script>
 
</body>
</html>
