<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooted Bible AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
 
    body {
      background: #c5c9c6;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #222;
    }
 
    .menu-bar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #ffffff;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }
 
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }
 
    .logo img { height: 44px; width: auto; border-radius: 6px; display: block; }
 
    .menu-links { display: flex; gap: 20px; list-style: none; }
    .menu-links a { text-decoration: none; color: #444; font-size: 16px; }
    .menu-links a:hover,
    .menu-links a.active { color: #000; border-bottom: 2px solid #000; }
 
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }
 
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
 
    .label {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 6px;
    }
 
    h1 { font-size: 28px; font-weight: normal; margin-bottom: 6px; }
 
    .intro { color: #6b716d; font-size: 15px; margin-bottom: 18px; }
 
    .chat {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 220px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 4px 2px 12px;
    }
 
    .msg {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
 
    .msg.user { align-self: flex-end; background: #222; color: #fff; border-bottom-right-radius: 4px; }
    .msg.ai { align-self: flex-start; background: #f2f3f2; border-bottom-left-radius: 4px; }
    .msg.error { align-self: center; background: #f6e7e4; color: #8a3324; font-size: 14px; }
 
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 16px; }
 
    .suggestions button {
      font-family: inherit;
      font-size: 14px;
      background: #f2f3f2;
      border: 1px solid #e2e5e3;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      color: #333;
    }
 
    .suggestions button:hover { background: #e2e5e3; }
 
    form { display: flex; gap: 10px; align-items: flex-end; border-top: 1px solid #e6e8e6; padding-top: 14px; }
 
    textarea {
      flex: 1;
      min-width: 0;
      font-family: inherit;
      font-size: 16px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: none;
      height: 52px;
    }
 
    .send {
      font-family: inherit;
      font-size: 15px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      height: 52px;
      cursor: pointer;
    }
 
    .send:hover { background: #000; }
    .send:disabled { background: #888; cursor: default; }
 
    textarea:focus-visible, .send:focus-visible, .suggestions button:focus-visible {
      outline: 2px solid #222;
      outline-offset: 2px;
    }
 
    .fine-print { margin-top: 14px; font-size: 13px; color: #4d534f; text-align: center; }
 
    /* Phone menu */
    .menu-bar { flex-wrap: wrap; gap: 10px; }
    @media (max-width: 480px) {
      .menu-links { gap: 14px; }
      .menu-links a { font-size: 15px; }
    }
  </style>
</head>
<body>
 
  <nav class="menu-bar">
    <div class="logo"><img src="images/rooted-logo-white.jpg" alt="Rooted logo">Rooted</div>
    <ul class="menu-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="read.html">Read</a></li>
    
      <li><a href="search.html">Search</a></li>
      <li><a href="news.html">News</a></li>
    </ul>
  </nav>
 
  <main>
    <section class="card">
      <p class="label">Bible AI</p>
      <h1>Ask Rooted AI...</h1>
      
      <div class="suggestions" id="suggestions">
        <button type="button">What does John 3:16 mean?</button>
        <button type="button">Verses about anxiety</button>
        <button type="button">Who was King David?</button>
        <button type="button">What should I read first?</button>
      </div>
 
      <div class="chat" id="chat" aria-live="polite"></div>
 
      <form id="ask-form">
        <textarea id="question" placeholder="Type your question…" aria-label="Your question"></textarea>
        <button class="send" id="send" type="submit">Ask</button>
      </form>
    </section>
 
    <p class="fine-print">AI answers can make mistakes. Check them against the Bible itself.</p>
  </main>
 
  <script>
    // Paste your Bible AI worker address here
    const AI_URL = "https://rootedai.lenodrips.workers.dev/";
 
    const chat = document.getElementById("chat");
    const form = document.getElementById("ask-form");
    const input = document.getElementById("question");
    const sendBtn = document.getElementById("send");
    const history = [];
 
    function addMessage(kind, text) {
      const div = document.createElement("div");
      div.className = "msg " + kind;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }
 
    async function ask(question) {
      question = question.trim();
      if (!question) return;
 
      if (!AI_URL) {
        addMessage("error", "The Bible AI isn't connected yet. Add your worker address to AI_URL in ask.html.");
        return;
      }
 
      document.getElementById("suggestions").hidden = true;
      addMessage("user", question);
      history.push({ role: "user", content: question });
      input.value = "";
      sendBtn.disabled = true;
      const thinking = addMessage("ai", "Thinking…");
 
      try {
        let res;
        try {
          // Sent as plain text so the browser doesn't need an extra permission check first
          res = await fetch(AI_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=UTF-8" },
            body: JSON.stringify({ messages: history })
          });
        } catch (e) {
          throw new Error("couldn't reach the AI worker. Open " + AI_URL + " in your browser to check that it's running.");
        }
        let data;
        try {
          data = await res.json();
        } catch (e) {
          throw new Error("the AI worker sent back something unexpected (status " + res.status + "). Make sure the new worker code is deployed.");
        }
        if (!res.ok || !data.answer) throw new Error(data.error || "No answer came back.");
        thinking.textContent = data.answer;
        history.push({ role: "assistant", content: data.answer });
      } catch (err) {
        thinking.remove();
        history.pop();
        addMessage("error", "Couldn't get an answer: " + err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }
 
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      ask(input.value);
    });
 
    // Enter sends, Shift+Enter makes a new line
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        ask(input.value);
      }
    });
 
    document.querySelectorAll("#suggestions button").forEach(function (b) {
      b.addEventListener("click", function () { ask(b.textContent); });
    });
  </script>
 
</body>
</html>
