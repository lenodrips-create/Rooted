<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooted Sign In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #c5c9c6;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #222;
    }

    [hidden] { display: none !important; }

    .menu-bar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #ffffff;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }
 
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }
 
    .logo img { height: 44px; width: auto; border-radius: 6px; display: block; }
 
    .menu-links { display: flex; gap: 20px; list-style: none; }
    .menu-links a { text-decoration: none; color: #444; font-size: 16px; }
    .menu-links a:hover,
    .menu-links a.active { color: #000; border-bottom: 2px solid #000; }
 
    /* Phone menu */
    .menu-bar { flex-wrap: wrap; gap: 10px; }
    @media (max-width: 480px) {
      .menu-links { gap: 14px; }
      .menu-links a { font-size: 15px; }
    }

    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }

    .back { display: inline-block; margin-bottom: 14px; color: #222; font-size: 15px; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 18px;
    }

    .label { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #777; margin-bottom: 6px; }
    h1 { font-size: 28px; font-weight: normal; margin-bottom: 6px; }
    h2 { font-size: 21px; font-weight: normal; margin-bottom: 12px; }
    .sub { color: #6b716d; font-size: 15px; margin-bottom: 18px; }

    label { display: block; font-size: 14px; color: #444; margin: 12px 0 5px; }

    input, textarea {
      width: 100%;
      font-family: inherit;
      font-size: 16px;
      padding: 11px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    textarea { min-height: 120px; resize: vertical; }

    .btn {
      font-family: inherit;
      font-size: 16px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 10px;
      height: 48px;
      padding: 0 22px;
      margin-top: 16px;
      cursor: pointer;
    }

    .btn:hover { background: #000; }
    .btn:disabled { background: #888; cursor: default; }
    .btn.wide { width: 100%; }

    .link-btn {
      font-family: inherit;
      font-size: 14px;
      background: none;
      border: none;
      color: #222;
      text-decoration: underline;
      cursor: pointer;
    }

    input:focus-visible, textarea:focus-visible, .btn:focus-visible, .link-btn:focus-visible, .back:focus-visible {
      outline: 2px solid #222;
      outline-offset: 2px;
    }

    .msg { margin-top: 14px; font-size: 14px; padding: 10px 12px; border-radius: 8px; }
    .msg.error { background: #f6e7e4; color: #8a3324; }
    .msg.ok { background: #e8f0ea; color: #2d5a3a; }

    .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

    .posts { list-style: none; }
    .posts li { padding: 12px 0; border-top: 1px solid #e6e8e6; display: flex; gap: 12px; align-items: flex-start; }
    .posts li:first-child { border-top: none; }
    .posts .text { flex: 1; min-width: 0; }
    .posts .date { display: block; font-size: 13px; color: #6b716d; }
    .posts strong { display: block; font-weight: normal; font-size: 16px; margin: 2px 0; }
    .posts p { font-size: 14px; color: #444; line-height: 1.45; overflow-wrap: anywhere; }
    .posts .del { color: #8a3324; }
    .empty { color: #6b716d; font-size: 14px; }
  </style>
</head>
<body>

  <nav class="menu-bar">
    <div class="logo"><img src="images/rooted-logo-white.jpg" alt="Rooted logo">Rooted</div>
    <ul class="menu-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="read.html">Read</a></li>
    
      <li><a href="search.html">Search</a></li>
      <li><a href="news.html">News</a></li>
      <li><a href="signin.html" class="active">Sign in</a></li>
    </ul>
  </nav>

  <main>

    <!-- Step 1: password -->
    <section class="card" id="signin-card">
      <p class="label">Rooted</p>
      <h1>Sign in</h1>
      <p class="sub">Enter the password to post Developer News.</p>
      <form id="signin-form" novalidate>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="btn wide" id="signin-btn" type="submit">Sign in</button>
        <p class="msg error" id="signin-msg" role="status" hidden></p>
      </form>
    </section>

    <!-- Step 2: post developer news -->
    <div id="admin" hidden>
      <section class="card">
        <div class="top">
          <h2>Post Developer News</h2>
          <button type="button" class="link-btn" id="signout">Sign out</button>
        </div>
        <form id="post-form" novalidate>
          <label for="title">Title</label>
          <input id="title" maxlength="120" required>
          <label for="body">Message</label>
          <textarea id="body" maxlength="2000" required></textarea>
          <button class="btn" id="post-btn" type="submit">Post</button>
          <p class="msg" id="post-msg" role="status" hidden></p>
        </form>
      </section>

      <section class="card">
        <h2>Posted</h2>
        <ul class="posts" id="posts"></ul>
      </section>
    </div>
  </main>

  <script>
    const LOGIN_URL = "https://wvghcoovpibfghwphgik.supabase.co/functions/v1/rooted-login";
    const NEWS_URL = "https://wvghcoovpibfghwphgik.supabase.co/functions/v1/rooted-devnews";
    const KEY = "rootedAdminPass";

    const $ = (id) => document.getElementById(id);

    function getPass() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function setPass(t) { try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch (e) {} }

    function show(signedIn) {
      $("signin-card").hidden = signedIn;
      $("admin").hidden = !signedIn;
      if (signedIn) loadPosts(); else $("password").focus();
    }

    function message(el, text, kind) {
      el.textContent = text || "";
      el.className = "msg " + (kind || "error");
      el.hidden = !text;
    }

    // ---------- Sign in ----------
    $("signin-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const password = $("password").value;
      if (!password) return;
      $("signin-btn").disabled = true;
      message($("signin-msg"), "");
      try {
        const res = await fetch(LOGIN_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (!data.token) throw new Error(data.error || "That password isn't right.");
        setPass(data.token);
        $("password").value = "";
        show(true);
      } catch (err) {
        message($("signin-msg"), err.message === "Failed to fetch" ? "Couldn't reach the server. Try again in a minute." : err.message);
      } finally {
        $("signin-btn").disabled = false;
      }
    });

    $("signout").addEventListener("click", function () { setPass(null); show(false); });

    // ---------- Developer News ----------
    function formatDate(iso) {
      return new Date(iso).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    }

    async function loadPosts() {
      const list = $("posts");
      try {
        const res = await fetch(NEWS_URL, { cache: "no-store" });
        const data = await res.json();
        list.innerHTML = "";
        if (!data.posts || !data.posts.length) {
          list.innerHTML = '<li class="empty">Nothing posted yet.</li>';
          return;
        }
        for (const p of data.posts) {
          const li = document.createElement("li");
          const text = document.createElement("div");
          text.className = "text";
          const date = document.createElement("span");
          date.className = "date";
          date.textContent = formatDate(p.created_at);
          const title = document.createElement("strong");
          title.textContent = p.title;
          const body = document.createElement("p");
          body.textContent = p.body;
          text.append(date, title, body);
          const del = document.createElement("button");
          del.type = "button";
          del.className = "link-btn del";
          del.textContent = "Delete";
          del.setAttribute("aria-label", "Delete post: " + p.title);
          del.addEventListener("click", () => deletePost(p));
          li.append(text, del);
          list.appendChild(li);
        }
      } catch (e) {
        list.innerHTML = '<li class="empty">Couldn\'t load the posts.</li>';
      }
    }

    // Requests that need the password send the pass from sign-in
    async function send(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + getPass() },
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        setPass(null);
        show(false);
        throw new Error("Please sign in again.");
      }
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    }

    $("post-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const title = $("title").value.trim();
      const body = $("body").value.trim();
      if (!title || !body) return message($("post-msg"), "Add a title and a message.");
      $("post-btn").disabled = true;
      message($("post-msg"), "");
      try {
        await send("POST", NEWS_URL, { title, body });
        $("title").value = "";
        $("body").value = "";
        message($("post-msg"), "Posted. It's on the home page now.", "ok");
        loadPosts();
      } catch (err) {
        if (!$("admin").hidden) message($("post-msg"), err.message);
        else message($("signin-msg"), err.message);
      } finally {
        $("post-btn").disabled = false;
      }
    });

    async function deletePost(p) {
      if (!confirm('Delete "' + p.title + '"?')) return;
      try {
        await send("DELETE", NEWS_URL + "?id=" + p.id);
        loadPosts();
      } catch (err) {
        if (!$("admin").hidden) message($("post-msg"), err.message);
        else message($("signin-msg"), err.message);
      }
    }

    // Already signed in on this device? Check the pass is still good.
    (async function start() {
      const pass = getPass();
      if (!pass) return show(false);
      try {
        const res = await fetch(LOGIN_URL, { headers: { Authorization: "Bearer " + pass } });
        const data = await res.json();
        if (data.valid) return show(true);
      } catch (e) {}
      setPass(null);
      show(false);
    })();
  </script>

</body>
</html>
